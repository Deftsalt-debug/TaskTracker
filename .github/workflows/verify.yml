name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run setup
      - run: npm run verify
      # Lint and static type-check tooling are not configured.
      # Adding development dependencies remains a separate maintainer decision.
